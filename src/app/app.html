<div class="app-layout">
  <nav class="global-nav" [class.open]="isSidebarOpen()">
    <div class="nav-brand" (click)="toggleSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="pokeball-icon">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
        <path d="M2 12h20" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="var(--surface-color)" />
      </svg>
      <span class="brand-text">PokéApp</span>
    </div>
    <ul class="nav-links">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <span class="nav-icon">📖</span>
          <span class="nav-label">Pokédex</span>
        </a>
      </li>
      <li>
        <a routerLink="/quiz" routerLinkActive="active">
          <span class="nav-icon">❓</span>
          <span class="nav-label">Quiz</span>
        </a>
      </li>
      <li>
        <a routerLink="/battle" routerLinkActive="active">
          <span class="nav-icon">⚔️</span>
          <span class="nav-label">Batalha</span>
        </a>
      </li>
    
      <!-- Dark Mode Toggle -->
      
      
    
    </ul>
    
    <ul class="nav-links" style="margin-top: auto;">
      <li class="lang-selector">
        <a href="#" (click)="cycleLanguage(); $event.preventDefault()" [attr.title]="'Idioma: ' + (i18n.currentLang() | uppercase)">
          <span class="nav-icon">🌐</span>
          <span class="nav-label">{{ i18n.currentLang() | uppercase }}</span>
        </a>
      </li>
      <li class="theme-toggle">
        <a href="#" (click)="toggleTheme(); $event.preventDefault()" [attr.aria-label]="isDarkMode() ? 'Ativar Modo Claro' : 'Ativar Modo Escuro'">
          <span class="nav-icon">{{ isDarkMode() ? '☀️' : '🌙' }}</span>
          <span class="nav-label">{{ isDarkMode() ? i18n.t('MODE_LIGHT') : i18n.t('MODE_DARK') }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <main class="app-main-content">
    <router-outlet />
  </main>
</div>
